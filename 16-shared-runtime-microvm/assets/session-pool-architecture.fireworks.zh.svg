<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="title desc">
  <title id="title">Shared Runtime microVM 用户亲和映射池架构</title>
  <desc id="desc">少量 AgentCore Runtime ARN 承载多个 runtimeSessionId，通过无状态路由器、DynamoDB 租约、持久状态和弹性控制实现每 session 最多并发十个请求。</desc>
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
    .title { font-size: 28px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 14px; fill: #6b7280; }
    .section { font-size: 16px; font-weight: 700; fill: #111827; }
    .label { font-size: 13px; font-weight: 600; fill: #111827; }
    .body { font-size: 12px; fill: #374151; }
    .muted { font-size: 11px; fill: #6b7280; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 11px; fill: #4b5563; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="#ffffff"/>
  <circle cx="1170" cy="30" r="78" fill="#eff6ff"/>
  <circle cx="1140" cy="55" r="18" fill="#dbeafe"/>
  <rect x="40" y="22" width="84" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="82" y="40" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">ARCHITECTURE</text>
  <text x="40" y="78" class="title">Shared Runtime microVM：用户亲和映射池</text>
  <text x="40" y="104" class="subtitle">少量 Runtime ARN 承载多个 runtimeSessionId；按活跃并发扩缩，而不是按注册用户扩容</text>
  <g filter="url(#shadow)">
    <rect x="846" y="20" width="314" height="78" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  </g>
  <line x1="950" y1="34" x2="950" y2="84" stroke="#e5e7eb"/>
  <line x1="1055" y1="34" x2="1055" y2="84" stroke="#e5e7eb"/>
  <text x="898" y="54" text-anchor="middle" font-size="23" font-weight="700" fill="#2563eb">10</text>
  <text x="898" y="76" text-anchor="middle" class="muted">Hard cap / session</text>
  <text x="1002" y="54" text-anchor="middle" font-size="23" font-weight="700" fill="#059669">6–7</text>
  <text x="1002" y="76" text-anchor="middle" class="muted">Target inflight</text>
  <text x="1107" y="54" text-anchor="middle" font-size="23" font-weight="700" fill="#7c3aed">≈ 8</text>
  <text x="1107" y="76" text-anchor="middle" class="muted">Active sessions*</text>
