  <path d="M 153,258 Q 153,236 167,236 Q 181,236 181,258" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="167" y="253" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed">…</text>
  <circle cx="123" cy="225" r="31" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="123" y="233" text-anchor="middle" font-size="22" font-weight="700" fill="#2563eb">5K</text>
  <text x="122" y="294" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">5,000 注册用户</text>
  <text x="122" y="320" text-anchor="middle" class="body">只为活跃请求分配容量</text>
  <text x="122" y="338" text-anchor="middle" class="muted">不预创建 microVM</text>
  <rect x="58" y="365" width="129" height="42" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
