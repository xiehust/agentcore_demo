  <text x="411" y="405" class="mono">Affinity · Pool · Lease</text>
  <text x="411" y="421" class="mono">Idempotency</text>
  <path d="M 205,285 H 223" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M 287,285 H 320" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect x="220" y="215" width="70" height="22" rx="4" fill="#ffffff" opacity="0.96"/>
