  <path d="M 65,258 Q 65,236 79,236 Q 93,236 93,258" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="79" y="253" text-anchor="middle" font-size="11" font-weight="700" fill="#2563eb">A</text>
