  <text x="380" y="165" class="section">Stateless Session Router</text>
  <text x="380" y="185" class="muted">身份、并发和执行位置解耦</text>
  <circle cx="348" cy="220" r="12" fill="#2563eb"/>
  <text x="348" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="370" y="224" class="label">Affinity</text>
  <text x="456" y="224" class="muted">userId → sessionId lease</text>
  <circle cx="348" cy="254" r="12" fill="#059669"/>
  <text x="348" y="258" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="370" y="258" class="label">Acquire</text>
  <text x="456" y="258" class="muted">条件写入 inflight &lt; 10</text>
  <circle cx="348" cy="288" r="12" fill="#7c3aed"/>
  <text x="348" y="292" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="370" y="292" class="label">幂等控制</text>
  <text x="456" y="292" class="muted">同用户串行 · 防重放</text>
  <circle cx="348" cy="322" r="12" fill="#ea580c"/>
  <text x="348" y="326" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <text x="370" y="326" class="label">排队背压</text>
  <text x="456" y="326" class="muted">短队列优先，再扩容</text>
  <rect x="340" y="356" width="240" height="72" rx="8" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
  <ellipse cx="376" cy="376" rx="22" ry="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="354" y="376" width="44" height="28" fill="#dbeafe"/>
  <line x1="354" y1="376" x2="354" y2="404" stroke="#2563eb" stroke-width="1.2"/>
