  <text x="122" y="424" text-anchor="middle" class="mono">requestId + runtimeUserId</text>
  <polygon points="255,241 287,260 287,310 255,329 223,310 223,260" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="255" y="289" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb">API</text>
  <text x="255" y="349" text-anchor="middle" class="muted">Gateway</text>
  <g filter="url(#shadow)">
    <rect x="320" y="138" width="280" height="310" rx="12" fill="#f0fdfa" stroke="#059669" stroke-width="2.2"/>
