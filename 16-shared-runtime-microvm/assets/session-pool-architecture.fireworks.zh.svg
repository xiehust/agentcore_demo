  <text x="694" y="582" font-size="11.3" fill="#374151">queue p95 · lease repair · stop</text>
  <text x="694" y="601" class="muted">目标 6–7；硬上限 10</text>
  <path d="M 745,500 V 460" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#arrow-orange)"/>
  <rect x="752" y="467" width="76" height="20" rx="4" fill="#ffffff" opacity="0.96"/>
