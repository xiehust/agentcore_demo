[project]
name = "runtime-dsh-coldstart"
version = "0.1.0"
description = "Cold-start benchmark for a DeepSeek Harness (dsh) agent on AgentCore Runtime"
requires-python = ">=3.11"
dependencies = ["boto3>=1.43.44"]

# coldstart_test.py matches pytest's default *_test.py pattern; keep collection
# to tests/ so the benchmark client is never imported as a test module.
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
