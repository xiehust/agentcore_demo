[project]
name = "claude-sdk-langfuse-agentcore"
version = "0.1.0"
description = "Claude Agent SDK to Langfuse to AgentCore on-demand evaluation demo"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "boto3==1.43.78",
    "claude-agent-sdk==0.2.144",
    "langfuse==4.14.4",
    "openinference-instrumentation-claude-agent-sdk==0.1.10",
]

[project.scripts]
claude-sdk-eval = "claude_sdk_evaluation.cli:main"

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright==1.1.411",
    "pytest==9.1.1",
    "ruff==0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/claude_sdk_evaluation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"assets/generate_diagrams.py" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
