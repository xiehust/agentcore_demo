<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" role="img" aria-labelledby="title desc">
<title id="title">End-to-end Evaluation Flow</title>
<desc id="desc">Run the agent, read back from Langfuse, then call AgentCore Evaluate directly</desc>
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif}</style>
<defs>
<marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0,10 3.5,0 7" fill="#2563eb"/>
</marker>
<marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0,10 3.5,0 7" fill="#16a34a"/>
</marker>
<marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0,10 3.5,0 7" fill="#9333ea"/>
</marker>
<marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0,10 3.5,0 7" fill="#ea580c"/>
</marker>
<marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
<polygon points="0 0,10 3.5,0 7" fill="#6b7280"/>
</marker>
</defs>
<rect width="1200" height="850" fill="#ffffff"/>
<text x="40" y="42" fill="#111827" font-size="24" font-weight="700">End-to-end Evaluation Flow</text>
<text x="40" y="68" fill="#6b7280" font-size="13">Run the agent, read back from Langfuse, then call AgentCore Evaluate directly</text>
<line x1="40" y1="84" x2="1160" y2="84" stroke="#e5e7eb"/>
<rect data-graph-role="decoration" x="35" y="108" width="1130" height="128" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="52" y="130" fill="#2563eb" font-size="10" font-weight="700">AGENT EXECUTION</text>
<rect data-graph-role="decoration" x="35" y="278" width="1130" height="128" rx="12" fill="#faf5ff" stroke="#ddd6fe"/>
<text x="52" y="300" fill="#7c3aed" font-size="10" font-weight="700">TRACE DELIVERY &amp; READBACK</text>
<rect data-graph-role="decoration" x="35" y="448" width="1130" height="270" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
<text x="52" y="470" fill="#16a34a" font-size="10" font-weight="700">CONVERSION &amp; EVALUATION</text>
<g data-graph-role="node">
<rect x="70" y="142" width="220" height="82" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="96" cy="168" r="15" fill="#2563eb"/>
<text x="96" y="173" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">1</text>
<text x="120" y="173" fill="#111827" font-size="14" font-weight="650">Validate config</text>
<text x="90" y="200" fill="#6b7280" font-size="11.5">keys / endpoint / AWS region</text>
<text x="272" y="159" text-anchor="end" fill="#2563eb" font-size="9.5" font-weight="700">LOCAL</text>
</g>
<g data-graph-role="node">
<rect x="330" y="142" width="220" height="82" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="356" cy="168" r="15" fill="#2563eb"/>
<text x="356" y="173" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">2</text>
<text x="380" y="173" fill="#111827" font-size="14" font-weight="650">Start tracing</text>
<text x="350" y="200" fill="#6b7280" font-size="11.5">Langfuse + OpenInference</text>
<text x="532" y="159" text-anchor="end" fill="#2563eb" font-size="9.5" font-weight="700">LOCAL</text>
</g>
<g data-graph-role="node">
<rect x="590" y="142" width="220" height="82" rx="10" fill="#fff7ed" stroke="#D97757" stroke-width="1.5"/>
<circle cx="616" cy="168" r="15" fill="#D97757"/>
<text x="616" y="173" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">3</text>
<text x="640" y="173" fill="#111827" font-size="14" font-weight="650">Run agent</text>
<text x="610" y="200" fill="#6b7280" font-size="11.5">Claude Agent SDK / Sonnet 5</text>
<text x="792" y="159" text-anchor="end" fill="#D97757" font-size="9.5" font-weight="700">CLAUDE</text>
</g>
<g data-graph-role="node">
<rect x="850" y="142" width="220" height="82" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="876" cy="168" r="15" fill="#16a34a"/>
<text x="876" y="173" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">4</text>
<text x="900" y="173" fill="#111827" font-size="14" font-weight="650">Execute MCP tool</text>
<text x="870" y="200" fill="#6b7280" font-size="11.5">lookup_product_price</text>
<text x="1052" y="159" text-anchor="end" fill="#16a34a" font-size="9.5" font-weight="700">LOCAL</text>
</g>
<g data-graph-role="node">
<rect x="850" y="312" width="220" height="82" rx="10" fill="#ffffff" stroke="#9333ea" stroke-width="1.5"/>
<circle cx="876" cy="338" r="15" fill="#9333ea"/>
<text x="876" y="343" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">5</text>
<text x="900" y="343" fill="#111827" font-size="14" font-weight="650">Flush spans</text>
<text x="870" y="370" fill="#6b7280" font-size="11.5">OpenTelemetry export</text>
<text x="1052" y="329" text-anchor="end" fill="#9333ea" font-size="9.5" font-weight="700">OTEL</text>
</g>
<g data-graph-role="node">
<rect x="590" y="312" width="220" height="82" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
<circle cx="616" cy="338" r="15" fill="#6366f1"/>
<text x="616" y="343" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">6</text>
<text x="640" y="343" fill="#111827" font-size="14" font-weight="650">Store trace</text>
<text x="610" y="370" fill="#6b7280" font-size="11.5">session / trace / observations</text>
<text x="792" y="329" text-anchor="end" fill="#6366f1" font-size="9.5" font-weight="700">LANGFUSE</text>
</g>
<g data-graph-role="node">
<rect x="330" y="312" width="220" height="82" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
<circle cx="356" cy="338" r="15" fill="#6366f1"/>
<text x="356" y="343" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">7</text>
<text x="380" y="343" fill="#111827" font-size="14" font-weight="650">Read session / trace</text>
<text x="350" y="370" fill="#6b7280" font-size="11.5">Sessions API + Trace API</text>
<text x="532" y="329" text-anchor="end" fill="#6366f1" font-size="9.5" font-weight="700">LANGFUSE</text>
</g>
<g data-graph-role="node">
<polygon points="180,302 275,353 180,404 85,353" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<circle cx="180" cy="332" r="14" fill="#ea580c"/>
<text x="180" y="336" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">8</text>
<text x="180" y="361" text-anchor="middle" fill="#111827" font-size="13" font-weight="650">Trace ready?</text>
<text x="180" y="380" text-anchor="middle" fill="#9a3412" font-size="10.5">contains AGENT span</text>
</g>
<g data-graph-role="node">
<rect x="300" y="510" width="220" height="82" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
<circle cx="326" cy="536" r="15" fill="#16a34a"/>
<text x="326" y="541" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">9</text>
<text x="350" y="541" fill="#111827" font-size="14" font-weight="650">Convert spans</text>
<text x="320" y="568" fill="#6b7280" font-size="11.5">AGENT / TOOL unified spans</text>
<text x="502" y="527" text-anchor="end" fill="#16a34a" font-size="9.5" font-weight="700">LOCAL</text>
</g>
<g data-graph-role="node">
<rect x="650" y="510" width="220" height="82" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
<circle cx="676" cy="536" r="15" fill="#ea580c"/>
<text x="676" y="541" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">10</text>
<text x="700" y="541" fill="#111827" font-size="14" font-weight="650">Call Evaluate</text>
<text x="670" y="568" fill="#6b7280" font-size="11.5">evaluationInput.sessionSpans</text>
<text x="852" y="527" text-anchor="end" fill="#ea580c" font-size="9.5" font-weight="700">AWS</text>
</g>
<g data-graph-role="node">
<rect x="920" y="510" width="220" height="82" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
<circle cx="950" cy="551" r="18" fill="#16a34a"/>
<text x="950" y="555" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">JSON</text>
<text x="978" y="546" fill="#111827" font-size="14" font-weight="650">Save result</text>
<text x="978" y="568" fill="#6b7280" font-size="11.5">score + explanation</text>
</g>
<rect x="70" y="625" width="220" height="62" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="180" y="650" text-anchor="middle" fill="#9a3412" font-size="13" font-weight="650">Wait 2 seconds</text>
<text x="180" y="670" text-anchor="middle" fill="#6b7280" font-size="11">Poll Langfuse API again</text>
