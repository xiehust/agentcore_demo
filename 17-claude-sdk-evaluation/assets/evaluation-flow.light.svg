<text x="585" y="538" text-anchor="middle" fill="#16a34a" font-size="11" font-weight="600">sessionSpans</text>
<path d="M870 551 H920" fill="none" stroke="#16a34a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-green)" data-graph-role="edge"/>
<rect x="867" y="524" width="56" height="20" rx="5" fill="#ffffff" opacity="0.96"/>
<text x="895" y="538" text-anchor="middle" fill="#16a34a" font-size="11" font-weight="600">result</text>
<path d="M85 353 H55 V656 H70" fill="none" stroke="#ea580c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-orange)" stroke-dasharray="6,4" data-graph-role="edge"/>
<rect x="28" y="486" width="54" height="20" rx="5" fill="#ffffff" opacity="0.96"/>
<text x="55" y="500" text-anchor="middle" fill="#ea580c" font-size="11" font-weight="600">No</text>
<path d="M290 656 H1165 V430 H440 V394" fill="none" stroke="#ea580c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-orange)" stroke-dasharray="6,4" data-graph-role="edge"/>
<rect x="793" y="408" width="54" height="20" rx="5" fill="#ffffff" opacity="0.96"/>
<text x="820" y="422" text-anchor="middle" fill="#ea580c" font-size="11" font-weight="600">retry</text>
<g transform="translate(55,758)">
<rect x="0" y="0" width="1090" height="54" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
<circle cx="28" cy="27" r="12" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="3,2"/>
<line x1="20" y1="19" x2="36" y2="35" stroke="#dc2626" stroke-width="2"/>
<text x="52" y="24" fill="#111827" font-size="12.5" font-weight="650">CloudWatch is not used</text>
<text x="52" y="41" fill="#6b7280" font-size="11">No Logs query or Transaction Search; Langfuse is the only trace source</text>
<text x="1068" y="32" text-anchor="end" fill="#9ca3af" font-size="11">Light / Flat Icon</text>
</g>
</svg>
