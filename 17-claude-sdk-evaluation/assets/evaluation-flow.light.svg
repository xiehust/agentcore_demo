<path d="M590 353 H550" fill="none" stroke="#9333ea" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-purple)" data-graph-role="edge"/>
<path d="M330 353 H275" fill="none" stroke="#9333ea" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-purple)" data-graph-role="edge"/>
<path d="M180 404 V445 H410 V510" fill="none" stroke="#16a34a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-green)" data-graph-role="edge"/>
<rect x="183" y="424" width="54" height="20" rx="5" fill="#ffffff" opacity="0.96"/>
<text x="210" y="438" text-anchor="middle" fill="#16a34a" font-size="11" font-weight="600">Yes</text>
<path d="M520 551 H650" fill="none" stroke="#16a34a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow-green)" data-graph-role="edge"/>
